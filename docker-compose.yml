version: "3"
services:
  server:
    container_name: yolog
    image: "limyeonjy/yolog"
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - app-tier

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-tier
    restart: always
    tty: true

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - 80:80
    restart: on-failure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge
